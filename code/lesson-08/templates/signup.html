{% extends "base.html" %}
{% block title %}Sign up · Slotbook{% endblock %}
{% block content %}
<h1>Create your account</h1>
<p class="lead">Free while you set up. No card needed.</p>
{% if let Some(e) = error %}<div class="flash error">{{ e }}</div>{% endif %}
<form class="stack" method="post" action="/signup">
  <label>Your name <input name="name" value="{{ name }}" required maxlength="80" autocomplete="name"></label>
  <label>Email <input name="email" type="email" value="{{ email }}" required autocomplete="email"></label>
  <label>Password <input name="password" type="password" required minlength="10" autocomplete="new-password"></label>
  <button>Create account</button>
  <p class="muted">Already have an account? <a href="/login">Log in</a></p>
</form>
{% endblock %}
