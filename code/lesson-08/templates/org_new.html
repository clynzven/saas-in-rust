{% extends "base.html" %}
{% block title %}New business · Slotbook{% endblock %}
{% block nav %}<a href="/dashboard">Dashboard</a>{% endblock %}
{% block content %}
<h1>Set up your business</h1>
<p class="lead">You can change everything later.</p>
{% if let Some(e) = error %}<div class="flash error">{{ e }}</div>{% endif %}
<form class="stack" method="post" action="/orgs">
  <label>Business name <input name="name" value="{{ name }}" required maxlength="80"></label>
  <label>Booking page address
    <input name="slug" value="{{ slug }}" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="kape-barbers">
    <span class="muted">Customers will book at /b/<em>your-address</em></span>
  </label>
  <label>Time zone
    <select name="timezone">
      {% for tz in timezones %}<option{% if self.is_selected(tz) %} selected{% endif %}>{{ tz }}</option>{% endfor %}
    </select>
  </label>
  <button>Create business</button>
</form>
{% endblock %}
